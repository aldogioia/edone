<section class="list-section">
  <h4 class="header">Macchinari</h4>
  <div class="content">
    <div class="search-bar">
      <input type="text" placeholder="Cerca macchinari...">
      <button class="add-btn">Nuovo Macchinario</button>
    </div>
    <div class="list">
      @for (item of items; track item.id) {
        <app-list-item [title]="item.name" [type]="'tool'">
          <div class="availability">
            <p>Quantità:</p>
            <p class="green">{{ item.availability }}</p>
          </div>
        </app-list-item>
      }
    </div>
  </div>
</section>
