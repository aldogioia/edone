<small [class.danger]="action() == 'Elimina'">
  {{ action() ? action() : 'Modifica' }}
</small>
@if (imageUrl()) {
  <img [src]="imageUrl()" [alt]="title()"/>
} @else if (icon()) {
  <hugeicons-icon [icon]="icon()!"></hugeicons-icon>
}
<div class="item-info">
  <p>{{ title() }}</p>
  <ng-content></ng-content>
</div>
