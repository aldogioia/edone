<section class="list-section">

  <div class="header">
    <h2>Macchinari</h2>
    <div class="search-section">
      <input type="search" placeholder="Cerca per nome...">
      <button class="primary">Nuovo Macchinario</button>
    </div>
  </div>
  <div class="list">
    @for (item of items; track item.id) {
      <app-list-item [title]="item.name" [type]="'tool'">
        <div class="availability">
          <p class="text-small">Quantità:</p>
          <p class="text-small green">{{ item.availability }}</p>
        </div>
      </app-list-item>
    }
  </div>
</section>
