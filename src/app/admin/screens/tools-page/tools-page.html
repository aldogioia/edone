<section class="list-section">

  <div class="header">
    <h2>Macchinari</h2>
    <div class="search-section">
      <input type="search" placeholder="Cerca per nome...">
      <button class="primary" (click)="isFormOpen = !isFormOpen">Nuovo Macchinario</button>
    </div>
  </div>
  <div class="list">
    @for (item of items; track item.id) {
      <app-list-item [title]="item.name" [type]="'tool'">
        <div class="availability">
          <p class="text-small">Quantità:</p>
          <p class="text-small green">{{ item.availability }}</p>
        </div>
      </app-list-item>
    }
  </div>
</section>

<form [formGroup]="createToolForm" [class.open]="isFormOpen" class="side-form" (ngSubmit)="createTool()">
  <div class="header">
    <h2>Nuovo Macchinario</h2>
  </div>

  <div class="form-groups">
    <div class="form-group">
      <label for="name">Nome</label>
      <input id="name" [formControl]="createToolForm.controls.name" type="text" placeholder="Nome Macchinario">
      @if (checkToolNameError()) {
        <p class="error">Il nome è obbligatorio</p>
      }
    </div>
    <div class="form-group">
      <label for="availability">Disponibilità</label>
      <input
        id="availability"
        [formControl]="createToolForm.controls.availability"
        type="number"
        placeholder="Disponibilità"
        step="1"
        min="1">
      @if (checkToolAvailabilityError()) {
        <p class="error">La disponibilità deve essere un numero intero positivo</p>
      }
    </div>
  </div>

  <button class="primary" type="submit">Aggiungi</button>
</form>
