<section class="list-section">

  <div class="header">
    <h2>Macchinari</h2>
    <div class="search-section">
      <input type="search" placeholder="Cerca per nome...">
      <button class="primary" (click)="isFormOpen = !isFormOpen">Nuovo Macchinario</button>
    </div>
  </div>
  <div class="list">
    @for (item of items; track item.id) {
      <app-list-item [title]="item.name" [type]="'tool'">
        <div class="availability">
          <p class="text-small">Quantità:</p>
          <p class="text-small green">{{ item.availability }}</p>
        </div>
      </app-list-item>
    }
  </div>
</section>

<form [class.open]="isFormOpen" class="side-form">
  <div class="header">
    <h2>Nuovo Macchinario</h2>
  </div>

  <div class="form-groups">
    <div class="form-group">
      <label for="name">Nome</label>
      <input id="name" type="text" placeholder="Nome Macchinario">
    </div>
    <div class="form-group">
      <label for="availability">Disponibilità</label>
      <input id="availability" type="number" placeholder="Disponibilità">
    </div>
  </div>

  <button class="primary" type="submit">Aggiungi</button>
</form>
